<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>غير متصل - أكاديمية نبض</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a1a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      direction: rtl;
    }
    
    .container {
      text-align: center;
      max-width: 480px;
    }
    
    .icon-wrapper {
      width: 120px;
      height: 120px;
      margin: 0 auto 32px;
      position: relative;
    }
    
    .icon-wrapper::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,245,255,0.15) 0%, transparent 70%);
      animation: pulse 2s ease-in-out infinite;
    }
    
    .wifi-icon {
      width: 80px;
      height: 80px;
      margin: 20px auto;
      position: relative;
    }
    
    .wifi-icon svg {
      width: 100%;
      height: 100%;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.1); opacity: 1; }
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    
    .floating { animation: float 3s ease-in-out infinite; }
    
    h1 {
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #00f5ff, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    p {
      font-size: 16px;
      color: #94a3b8;
      line-height: 1.8;
      margin-bottom: 8px;
    }
    
    .hint {
      font-size: 14px;
      color: #64748b;
      margin-top: 16px;
      padding: 16px;
      background: rgba(0, 245, 255, 0.05);
      border-radius: 12px;
      border: 1px solid rgba(0, 245, 255, 0.1);
    }
    
    .hint strong {
      color: #00f5ff;
    }
    
    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 24px;
      padding: 14px 32px;
      background: linear-gradient(135deg, #00f5ff, #00d4ee);
      color: #0a0a1a;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .retry-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 245, 255, 0.3);
    }
    
    .retry-btn:active {
      transform: translateY(0);
    }
    
    .logo {
      font-size: 14px;
      color: #475569;
      margin-top: 40px;
    }
    
    .logo span {
      color: #00f5ff;
      font-weight: 700;
    }

    .slash-line {
      stroke: #ef4444;
      stroke-width: 4;
      stroke-linecap: round;
      animation: pulse 2s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrapper floating">
      <div class="wifi-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- WiFi signal lines -->
          <path d="M2 8.5C5.5 4.5 10 3 12 3C14 3 18.5 4.5 22 8.5" stroke="#00f5ff" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
          <path d="M5 12C7 9.5 9.5 8.5 12 8.5C14.5 8.5 17 9.5 19 12" stroke="#00f5ff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
          <path d="M8.5 15.5C9.5 14 10.5 13.5 12 13.5C13.5 13.5 14.5 14 15.5 15.5" stroke="#00f5ff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
          <circle cx="12" cy="18" r="1.5" fill="#00f5ff"/>
          <!-- Red slash -->
          <line x1="3" y1="3" x2="21" y2="21" class="slash-line"/>
        </svg>
      </div>
    </div>
    
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>يبدو أنك غير متصل بالإنترنت حالياً</p>
    <p>لا تقلق! الدروس التي شاهدتها مسبقاً لا تزال متاحة</p>
    
    <div class="hint">
      💡 <strong>نصيحة:</strong> الدروس المحفوظة ستظهر مع علامة 📱 بجانبها، ويمكنك متابعة دراستك بدون إنترنت
    </div>
    
    <button class="retry-btn" onclick="window.location.reload()">
      🔄 إعادة المحاولة
    </button>
    
    <div class="logo">
      <span>أكاديمية</span> نبض
    </div>
  </div>
  
  <script>
    // Auto-retry when back online
    window.addEventListener('online', () => {
      window.location.reload();
    });
    
    // Check periodically
    setInterval(() => {
      if (navigator.onLine) {
        window.location.reload();
      }
    }, 5000);
  </script>
</body>
</html>
