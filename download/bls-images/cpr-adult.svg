<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a237e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#283593;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e53935;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c62828;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="760" height="560" rx="20" fill="none" stroke="#fff" stroke-width="2" opacity="0.2"/>
  <!-- Title -->
  <text x="400" y="60" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#fff">إنعاش القلب والرئتين للبالغين - CPR</text>
  <!-- Person silhouette -->
  <g transform="translate(200,120)">
    <ellipse cx="100" cy="40" rx="35" ry="40" fill="#90caf9" opacity="0.8"/>
    <rect x="60" y="80" width="80" height="150" rx="10" fill="#90caf9" opacity="0.6"/>
    <rect x="40" y="90" width="40" height="120" rx="8" fill="#90caf9" opacity="0.5" transform="rotate(-10,60,90)"/>
    <rect x="120" y="90" width="40" height="120" rx="8" fill="#90caf9" opacity="0.5" transform="rotate(10,140,90)"/>
    <rect x="70" y="230" width="30" height="140" rx="8" fill="#90caf9" opacity="0.4"/>
    <rect x="100" y="230" width="30" height="140" rx="8" fill="#90caf9" opacity="0.4"/>
  </g>
  <!-- Hand position indicator -->
  <g transform="translate(230,230)">
    <ellipse cx="70" cy="20" rx="45" ry="20" fill="#e53935" opacity="0.7" filter="url(#shadow)"/>
    <ellipse cx="70" cy="20" rx="45" ry="20" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="70" y="25" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff">موضع اليدين</text>
  </g>
  <!-- Arrow pointing to chest -->
  <line x1="370" y1="250" x2="310" y2="250" stroke="#e53935" stroke-width="3" marker-end="url(#arrowhead)"/>
  <!-- Info boxes -->
  <g transform="translate(470,100)">
    <rect width="280" height="70" rx="12" fill="url(#accent)" filter="url(#shadow)"/>
    <text x="140" y="30" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#fff">معدل الضغطات</text>
    <text x="140" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#fff">100 - 120 / دقيقة</text>
  </g>
  <g transform="translate(470,190)">
    <rect width="280" height="70" rx="12" fill="#1565c0" filter="url(#shadow)"/>
    <text x="140" y="30" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#fff">عمق الضغطات</text>
    <text x="140" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#fff">5 - 6 سم</text>
  </g>
  <g transform="translate(470,280)">
    <rect width="280" height="70" rx="12" fill="#2e7d32" filter="url(#shadow)"/>
    <text x="140" y="30" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#fff">نسبة الضغطات للتهوية</text>
    <text x="140" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#fff">30 : 2</text>
  </g>
  <!-- Key points -->
  <g transform="translate(470,380)">
    <rect width="280" height="170" rx="12" fill="#fff" opacity="0.1"/>
    <text x="140" y="30" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#fff">النقاط الأساسية</text>
    <circle cx="30" cy="60" r="8" fill="#e53935"/>
    <text x="50" y="65" font-family="Arial,sans-serif" font-size="14" fill="#e0e0e0">الارتداد الكامل للصدر</text>
    <circle cx="30" cy="90" r="8" fill="#e53935"/>
    <text x="50" y="95" font-family="Arial,sans-serif" font-size="14" fill="#e0e0e0">أقل انقطاع ممكن</text>
    <circle cx="30" cy="120" r="8" fill="#e53935"/>
    <text x="50" y="125" font-family="Arial,sans-serif" font-size="14" fill="#e0e0e0">التبديل كل دقيقتين</text>
    <circle cx="30" cy="150" r="8" fill="#e53935"/>
    <text x="50" y="155" font-family="Arial,sans-serif" font-size="14" fill="#e0e0e0">الضغط على النصف السفلي من القص</text>
  </g>
  <!-- Heartbeat line -->
  <polyline points="30,570 100,570 120,530 140,610 160,540 180,570 250,570 270,530 290,610 310,540 330,570 770,570" fill="none" stroke="#e53935" stroke-width="2" opacity="0.5"/>
</svg>
